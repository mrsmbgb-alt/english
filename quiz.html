<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - English Learning Platform</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/ad-manager.js" defer></script>
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/auth.js" defer></script>
    <script src="/assets/js/app.js" defer></script>
    
    <style>
        /* Quiz option styles */
        .quiz-option {
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .quiz-option:hover {
            background: #f3f4f6;
        }
        
        .quiz-option.selected {
            background: #dbeafe;
            border-color: #3b82f6;
        }
        
        .quiz-option.correct {
            background: #d1fae5;
            border-color: #10b981;
        }
        
        .quiz-option.wrong {
            background: #fee2e2;
            border-color: #ef4444;
        }
        
        /* Progress dots */
        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e5e7eb;
            transition: all 0.2s;
        }
        
        .progress-dot.active {
            background: #3b82f6;
            transform: scale(1.3);
        }
        
        .progress-dot.answered {
            background: #10b981;
        }
        
        /* Timer pulse animation */
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .timer-danger {
            color: #ef4444;
            animation: pulse-red 1s infinite;
        }
        
        /* Score ring animation */
        @keyframes draw-circle {
            from {
                stroke-dashoffset: 440;
            }
        }
        
        .score-circle {
            animation: draw-circle 1s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-50">
    
    <!-- Header Ad -->
    <div data-ad-slot="header"></div>
    
    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-purple-600">EnglishBD</a>
            <div id="nav-auth"></div>
        </div>
    </nav>
    
    <!-- Main Container -->
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        
        <!-- Quiz Container -->
        <div id="quiz-container" class="bg-white rounded-lg shadow-md">
            <!-- Loading state -->
            <div class="flex justify-center items-center py-24">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
            </div>
        </div>
        
    </div>
    
    <!-- Footer Ad -->
    <div data-ad-slot="footer" class="bg-gray-100 py-4 mt-12"></div>
    
    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 EnglishBD. All rights reserved.</p>
        </div>
    </footer>
    
    <!-- Sticky Bottom Ad (Mobile) -->
    <div data-ad-slot="sticky_bottom" class="lg:hidden"></div>
    
    <script>
        let currentCourse = null;
        let currentDay = null;
        let quizData = null;
        let userAnswers = {};
        let currentQuestionIndex = 0;
        let timerInterval = null;
        let timeRemaining = 600; // 10 minutes default
        let quizStarted = false;
        let quizSubmitted = false;
        
        // Initialize
        async function init() {
            const user = await Auth.requireLogin();
            if (!user) return;
            
            // Get course and day from URL
            const urlParams = new URLSearchParams(window.location.search);
            currentCourse = urlParams.get('slug');
            currentDay = parseInt(urlParams.get('day') || '1');
            
            if (!currentCourse || !currentDay) {
                App.showToast('Invalid quiz URL', 'error');
                setTimeout(() => window.location.href = '/courses.html', 2000);
                return;
            }
            
            initNav(user);
            await loadQuiz();
        }
        
        // Initialize navigation
        function initNav(user) {
            const navAuth = document.getElementById('nav-auth');
            navAuth.innerHTML = `
                <span class="text-gray-700 hidden md:inline">Hi, ${App.escapeHtml(user.name)}</span>
                <button onclick="Auth.logout()" class="text-gray-700 hover:text-purple-600">Logout</button>
            `;
        }
        
        // Load quiz
        async function loadQuiz() {
            const container = document.getElementById('quiz-container');
            
            try {
                const response = await API.quiz.get(currentCourse, currentDay);
                quizData = response.data;
                
                // Show start screen
                showStartScreen();
                
            } catch (error) {
                container.innerHTML = `
                    <div class="text-center py-12 px-6">
                        <p class="text-red-500 mb-4">${error.message || 'Failed to load quiz'}</p>
                        <a href="/lesson.html?slug=${currentCourse}&day=${currentDay}" class="text-purple-600 hover:underline">
                            Back to Lesson
                        </a>
                    </div>
                `;
            }
        }
        
        // Show start screen
        function showStartScreen() {
            const container = document.getElementById('quiz-container');
            
            // Before Quiz Ad
            const beforeQuizAdHtml = '<div data-ad-slot="before_quiz" class="my-6"></div>';
            
            container.innerHTML = `
                ${beforeQuizAdHtml}
                
                <div class="p-8 text-center">
                    <h1 class="text-3xl font-bold mb-4">Day ${currentDay} Quiz</h1>
                    <p class="text-gray-600 mb-8">${quizData.course.title}</p>
                    
                    <div class="bg-blue-50 border border-blue-200 rounded-lg p-6 mb-8 text-left max-w-md mx-auto">
                        <h3 class="font-semibold text-lg mb-3">Quiz Rules:</h3>
                        <ul class="space-y-2 text-gray-700">
                            <li>✓ ${quizData.questions.length} questions</li>
                            <li>✓ Total marks: ${quizData.total_marks}</li>
                            <li>✓ Pass percentage: ${quizData.pass_percentage}%</li>
                            <li>✓ Time limit: 10 minutes</li>
                            <li>✓ You can review answers before submitting</li>
                        </ul>
                    </div>
                    
                    <button onclick="startQuiz()" class="bg-purple-600 text-white px-8 py-3 rounded-lg text-lg font-semibold hover:bg-purple-700 transition">
                        Start Quiz
                    </button>
                </div>
            `;
            
            // Reinitialize ad manager for before_quiz slot
            if (window.AdManager && typeof window.AdManager.reload === 'function') {
                setTimeout(() => {
                    const adSlot = container.querySelector('[data-ad-slot="before_quiz"]');
                    if (adSlot) {
                        // Trigger ad loading for this specific slot
                        // In production, you'd call a specific method
                        console.log('Before quiz ad slot ready');
                    }
                }, 100);
            }
        }
        
        // Start quiz
        function startQuiz() {
            quizStarted = true;
            currentQuestionIndex = 0;
            userAnswers = {};
            timeRemaining = 600; // 10 minutes
            
            showQuestion();
            startTimer();
        }
        
        // Show question
        function showQuestion() {
            const container = document.getElementById('quiz-container');
            const question = quizData.questions[currentQuestionIndex];
            const totalQuestions = quizData.questions.length;
            
            container.innerHTML = `
                <div class="p-8">
                    <!-- Timer & Progress -->
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex space-x-1">
                            ${quizData.questions.map((_, idx) => `
                                <div class="progress-dot ${idx === currentQuestionIndex ? 'active' : ''} ${userAnswers[quizData.questions[idx].id] ? 'answered' : ''}"></div>
                            `).join('')}
                        </div>
                        <div id="timer" class="text-lg font-semibold text-gray-700">10:00</div>
                    </div>
                    
                    <!-- Question -->
                    <div class="mb-8">
                        <div class="text-sm text-gray-500 mb-2">Question ${currentQuestionIndex + 1} of ${totalQuestions}</div>
                        <h2 class="text-2xl font-bold mb-6">${App.escapeHtml(question.question)}</h2>
                        
                        <!-- Options -->
                        <div class="space-y-3">
                            ${question.options.map((option, idx) => {
                                const isSelected = userAnswers[question.id] === option;
                                return `
                                    <div 
                                        class="quiz-option border-2 rounded-lg p-4 ${isSelected ? 'selected' : 'border-gray-200'}"
                                        onclick="selectAnswer(${question.id}, '${App.escapeHtml(option).replace(/'/g, "\\'")}')"
                                    >
                                        <div class="flex items-center">
                                            <div class="w-6 h-6 rounded-full border-2 ${isSelected ? 'bg-blue-500 border-blue-500' : 'border-gray-300'} flex items-center justify-center mr-3">
                                                ${isSelected ? '<svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>' : ''}
                                            </div>
                                            <span class="text-gray-800">${App.escapeHtml(option)}</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    
                    <!-- Navigation -->
                    <div class="flex justify-between items-center">
                        <button 
                            onclick="prevQuestion()"
                            class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition ${currentQuestionIndex === 0 ? 'opacity-50 cursor-not-allowed' : ''}"
                            ${currentQuestionIndex === 0 ? 'disabled' : ''}
                        >
                            ← Previous
                        </button>
                        
                        ${currentQuestionIndex === totalQuestions - 1 ? `
                            <button onclick="confirmSubmit()" class="bg-green-600 text-white px-8 py-2 rounded-lg hover:bg-green-700 transition font-semibold">
                                Submit Quiz
                            </button>
                        ` : `
                            <button onclick="nextQuestion()" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition">
                                Next →
                            </button>
                        `}
                    </div>
                </div>
            `;
        }
        
        // Select answer
        function selectAnswer(questionId, answer) {
            userAnswers[questionId] = answer;
            showQuestion(); // Refresh to show selection
        }
        
        // Previous question
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion();
            }
        }
        
        // Next question
        function nextQuestion() {
            if (currentQuestionIndex < quizData.questions.length - 1) {
                currentQuestionIndex++;
                showQuestion();
            }
        }
        
        // Start timer
        function startTimer() {
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    App.showToast('Time is up! Auto-submitting...', 'warning');
                    setTimeout(() => submitQuiz(), 2000);
                }
            }, 1000);
        }
        
        // Update timer display
        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            const display = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            const timerElement = document.getElementById('timer');
            if (timerElement) {
                timerElement.textContent = display;
                
                // Add danger class if less than 1 minute
                if (timeRemaining < 60) {
                    timerElement.classList.add('timer-danger');
                }
            }
        }
        
        // Confirm submit
        function confirmSubmit() {
            const answeredCount = Object.keys(userAnswers).length;
            const totalQuestions = quizData.questions.length;
            
            if (answeredCount < totalQuestions) {
                if (!confirm(`You've answered ${answeredCount} out of ${totalQuestions} questions. Submit anyway?`)) {
                    return;
                }
            }
            
            submitQuiz();
        }
        
        // Submit quiz
        async function submitQuiz() {
            if (quizSubmitted) return;
            quizSubmitted = true;
            
            clearInterval(timerInterval);
            
            const container = document.getElementById('quiz-container');
            container.innerHTML = `
                <div class="flex justify-center items-center py-24">
                    <div class="text-center">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600 mx-auto mb-4"></div>
                        <p class="text-gray-600">Submitting your answers...</p>
                    </div>
                </div>
            `;
            
            try {
                const response = await API.quiz.submit(
                    quizData.course.id,
                    currentDay,
                    userAnswers
                );
                
                const result = response.data;
                showResult(result);
                
            } catch (error) {
                App.showToast(error.message || 'Failed to submit quiz', 'error');
                quizSubmitted = false;
                showQuestion();
            }
        }
        
        // Show result
        function showResult(result) {
            const container = document.getElementById('quiz-container');
            const passed = result.passed;
            const scorePercentage = result.score;
            
            // Calculate circle progress (circumference = 2 * π * r)
            const radius = 70;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (scorePercentage / 100) * circumference;
            
            // After Quiz Ad
            const afterQuizAdHtml = '<div data-ad-slot="after_quiz" class="my-6"></div>';
            
            container.innerHTML = `
                ${afterQuizAdHtml}
                
                <div class="p-8 text-center">
                    <!-- Score Circle -->
                    <div class="mb-8">
                        <svg width="200" height="200" class="mx-auto">
                            <circle cx="100" cy="100" r="${radius}" fill="none" stroke="#e5e7eb" stroke-width="12"/>
                            <circle 
                                cx="100" cy="100" r="${radius}" 
                                fill="none" 
                                stroke="${passed ? '#10b981' : '#ef4444'}" 
                                stroke-width="12"
                                stroke-dasharray="${circumference}"
                                stroke-dashoffset="${offset}"
                                stroke-linecap="round"
                                transform="rotate(-90 100 100)"
                                class="score-circle"
                            />
                            <text x="100" y="100" text-anchor="middle" dy="0.3em" class="text-4xl font-bold" fill="${passed ? '#10b981' : '#ef4444'}">
                                ${scorePercentage}%
                            </text>
                        </svg>
                    </div>
                    
                    <h2 class="text-3xl font-bold mb-4 ${passed ? 'text-green-600' : 'text-red-600'}">
                        ${passed ? '🎉 Congratulations!' : '📚 Keep Practicing!'}
                    </h2>
                    <p class="text-xl text-gray-700 mb-8">
                        ${passed ? 'You passed the quiz!' : 'You need 60% to pass. Try again!'}
                    </p>
                    
                    <!-- Stats -->
                    <div class="grid grid-cols-3 gap-4 max-w-md mx-auto mb-8">
                        <div class="bg-gray-50 rounded-lg p-4">
                            <div class="text-2xl font-bold text-green-600">${result.obtained_marks}</div>
                            <div class="text-sm text-gray-600">Correct</div>
                        </div>
                        <div class="bg-gray-50 rounded-lg p-4">
                            <div class="text-2xl font-bold text-red-600">${result.total_marks - result.obtained_marks}</div>
                            <div class="text-sm text-gray-600">Wrong</div>
                        </div>
                        <div class="bg-gray-50 rounded-lg p-4">
                            <div class="text-2xl font-bold text-blue-600">${result.attempts}</div>
                            <div class="text-sm text-gray-600">Attempts</div>
                        </div>
                    </div>
                    
                    <!-- Actions -->
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        ${passed ? `
                            <a href="/lesson.html?slug=${currentCourse}&day=${currentDay + 1}" class="bg-purple-600 text-white px-8 py-3 rounded-lg hover:bg-purple-700 transition font-semibold">
                                Next Day →
                            </a>
                        ` : `
                            <button onclick="location.reload()" class="bg-purple-600 text-white px-8 py-3 rounded-lg hover:bg-purple-700 transition font-semibold">
                                Try Again
                            </button>
                        `}
                        <button onclick="showAnswers(${JSON.stringify(result.results).replace(/"/g, '&quot;')})" class="bg-gray-200 text-gray-800 px-8 py-3 rounded-lg hover:bg-gray-300 transition font-semibold">
                            Review Answers
                        </button>
                    </div>
                </div>
            `;
            
            // Reinitialize ad manager for after_quiz slot
            if (window.AdManager && typeof window.AdManager.reload === 'function') {
                setTimeout(() => {
                    const adSlot = container.querySelector('[data-ad-slot="after_quiz"]');
                    if (adSlot) {
                        console.log('After quiz ad slot ready');
                    }
                }, 100);
            }
        }
        
        // Show answers review
        function showAnswers(results) {
            const container = document.getElementById('quiz-container');
            
            container.innerHTML = `
                <div class="p-8">
                    <h2 class="text-2xl font-bold mb-6">Answer Review</h2>
                    
                    <div class="space-y-6">
                        ${results.map((result, idx) => {
                            const question = quizData.questions.find(q => q.id === result.question_id);
                            return `
                                <div class="border rounded-lg p-6 ${result.is_correct ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50'}">
                                    <div class="flex items-start justify-between mb-4">
                                        <h3 class="text-lg font-semibold flex-1">${idx + 1}. ${App.escapeHtml(question.question)}</h3>
                                        <span class="${result.is_correct ? 'text-green-600' : 'text-red-600'} font-bold">
                                            ${result.is_correct ? '✓ Correct' : '✗ Wrong'}
                                        </span>
                                    </div>
                                    
                                    <div class="space-y-2 mb-4">
                                        ${question.options.map(option => {
                                            const isUserAnswer = option === result.user_answer;
                                            const isCorrect = option === result.correct_answer;
                                            
                                            let className = 'p-3 rounded ';
                                            if (isCorrect) {
                                                className += 'bg-green-100 border border-green-300';
                                            } else if (isUserAnswer) {
                                                className += 'bg-red-100 border border-red-300';
                                            } else {
                                                className += 'bg-white border border-gray-200';
                                            }
                                            
                                            return `
                                                <div class="${className}">
                                                    ${isCorrect ? '✓ ' : isUserAnswer ? '✗ ' : ''}${App.escapeHtml(option)}
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                    
                                    ${result.explanation ? `
                                        <div class="bg-blue-50 border border-blue-200 rounded p-4">
                                            <strong>Explanation:</strong> ${App.escapeHtml(result.explanation)}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                    
                    <div class="mt-8 text-center">
                        <a href="/dashboard.html" class="bg-purple-600 text-white px-8 py-3 rounded-lg hover:bg-purple-700 transition font-semibold inline-block">
                            Back to Dashboard
                        </a>
                    </div>
                </div>
            `;
        }
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
