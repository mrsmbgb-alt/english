<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz — English Platform</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />

  <!-- Ads SDK -->
  <script src="/assets/js/ad-manager.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
</head>

<!-- quiz state controls ads (NO ADS during in-progress) -->
<body class="bg-slate-50 text-slate-900" data-quiz-state="start">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="container-page px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-bold text-lg">English Platform</a>
      <nav class="flex items-center gap-3 text-sm">
        <a href="/courses.html" class="hover:underline">Courses</a>
        <a href="/dashboard.html" class="hover:underline auth-only hidden">Dashboard</a>
        <a href="/login.html" class="hover:underline guest-only">Login</a>
        <button class="auth-only hidden px-3 py-1 rounded bg-slate-900 text-white" id="logoutBtn">Logout</button>
      </nav>
    </div>

    <!-- Header ad allowed on start/result; hidden during in-progress by JS -->
    <div class="container-page px-4 pb-3 quiz-ad-allowed">
      <div class="ad-slot" data-ad-slot="header"></div>
    </div>
  </header>

  <main class="container-page px-4 py-4">
    <div class="layout-grid">
      <aside class="sidebar-left"></aside>

      <section class="content">
        <article class="p-4 rounded bg-white border border-slate-200">
          <div id="alert" class="hidden mb-4 p-3 rounded text-sm"></div>

          <!-- Start screen -->
          <section id="startScreen">
            <h1 class="text-xl font-bold" id="quizTitle">Quiz</h1>
            <p class="text-sm text-slate-700 mt-2">
              Rules: Timer চলবে। শেষ 60s এ red pulse হবে। Time শেষ হলে auto-submit।
              Pass threshold: <b>≥60%</b>.
            </p>

            <!-- Ad before quiz (start screen only) -->
            <div class="mt-4 ad-slot quiz-ad-allowed" data-ad-slot="before_quiz"></div>

            <div class="mt-4 flex flex-wrap gap-2">
              <button id="startBtn" class="px-4 py-2 rounded bg-blue-600 text-white">Start Quiz</button>
              <a id="backLesson" class="px-4 py-2 rounded bg-slate-900 text-white" href="#">Back to Lesson</a>
            </div>
          </section>

          <!-- In-progress quiz (NO ADS here) -->
          <section id="quizScreen" class="hidden">
            <div class="flex items-center justify-between gap-3">
              <div class="text-sm font-semibold" id="qCount">Question</div>
              <div class="text-sm font-semibold">
                Time: <span id="timer" class="timer-pill">--:--</span>
              </div>
            </div>

            <div id="dots" class="mt-3 flex flex-wrap gap-2"></div>

            <div class="mt-4 p-3 rounded border border-slate-200 bg-slate-50">
              <div id="questionText" class="font-semibold"></div>
              <div id="options" class="mt-3 space-y-2"></div>
            </div>

            <div class="mt-4 flex items-center justify-between">
              <button id="prevBtn" class="px-3 py-2 rounded bg-slate-200">Prev</button>
              <button id="nextBtn" class="px-3 py-2 rounded bg-slate-900 text-white">Next</button>
              <button id="submitBtn" class="px-3 py-2 rounded bg-green-600 text-white">Submit</button>
            </div>
          </section>

          <!-- Result screen -->
          <section id="resultScreen" class="hidden">
            <h2 class="text-lg font-bold">Result</h2>

            <div class="mt-4 flex flex-col sm:flex-row gap-4 items-center">
              <div class="score-ring">
                <svg width="120" height="120" viewBox="0 0 120 120" aria-label="Score ring">
                  <circle cx="60" cy="60" r="50" stroke="#e2e8f0" stroke-width="10" fill="none"></circle>
                  <circle id="ring" cx="60" cy="60" r="50" stroke="#22c55e" stroke-width="10" fill="none"
                          stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314"></circle>
                  <text x="60" y="66" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a" id="scoreText">0%</text>
                </svg>
              </div>

              <div class="text-sm">
                <div><b id="passText">—</b></div>
                <div class="mt-1">Correct: <span id="correctText">0</span> / <span id="totalText">0</span></div>
                <div class="mt-1">Marks: <span id="marksText">0</span></div>
              </div>
            </div>

            <!-- Ad after quiz (result screen only) -->
            <div class="mt-4 ad-slot quiz-ad-allowed" data-ad-slot="after_quiz"></div>

            <div class="mt-4 flex flex-wrap gap-2">
              <a id="nextDayBtn" class="px-4 py-2 rounded bg-blue-600 text-white hidden" href="#">Next Day</a>
              <button id="retryBtn" class="px-4 py-2 rounded bg-slate-900 text-white">Retry</button>
              <a id="backLesson2" class="px-4 py-2 rounded bg-slate-200" href="#">Back to Lesson</a>
            </div>

            <h3 class="mt-6 font-semibold">Answer Review</h3>
            <div id="review" class="mt-3 space-y-3"></div>
          </section>
        </article>

        <!-- Footer ad allowed on start/result -->
        <div class="mt-4 ad-slot quiz-ad-allowed" data-ad-slot="footer"></div>
      </section>

      <aside class="sidebar-right">
        <!-- Sidebar ads OFF on tablet by responsive.css; allowed here start/result -->
        <div class="ad-slot quiz-ad-allowed" data-ad-slot="sidebar_top"></div>
        <div class="mt-4 ad-slot quiz-ad-allowed" data-ad-slot="sidebar_bottom"></div>
      </aside>
    </div>
  </main>

  <!-- Sticky bottom ad allowed on start/result; hidden during in-progress by JS -->
  <div class="sticky-bottom-wrap quiz-ad-allowed">
    <div class="ad-slot sticky-bottom-ad" data-ad-slot="sticky_bottom"></div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      // Ads allowed on start screen
      window.AdManager?.init?.();

      const alertBox = document.getElementById('alert');
      const show = (ok, msg) => {
        alertBox.className = 'mb-4 p-3 rounded text-sm ' + (ok ? 'bg-green-100 text-green-900' : 'bg-red-100 text-red-900');
        alertBox.textContent = msg;
        alertBox.classList.remove('hidden');
      };

      // Route support: /quiz/{slug}/{day} OR query
      const parseRoute = () => {
        const path = location.pathname.replace(/\/+$/, '');
        const m = path.match(/\/quiz\/([^\/]+)\/(\d+)$/);
        if (m) return { slug: decodeURIComponent(m[1]), day: Number(m[2]) };
        const qs = new URLSearchParams(location.search);
        return { slug: qs.get('course') || '', day: Number(qs.get('day') || 1) };
      };

      const { slug, day } = parseRoute();
      if (!slug) return show(false, 'Course not specified');

      const quizTitle = document.getElementById('quizTitle');
      quizTitle.textContent = `Quiz — ${slug} (Day ${day})`;

      const backLesson = document.getElementById('backLesson');
      const backLesson2 = document.getElementById('backLesson2');
      backLesson.href = `/lesson.html?course=${encodeURIComponent(slug)}&day=${day}`;
      backLesson2.href = `/lesson.html?course=${encodeURIComponent(slug)}&day=${day}`;

      const startScreen = document.getElementById('startScreen');
      const quizScreen = document.getElementById('quizScreen');
      const resultScreen = document.getElementById('resultScreen');

      const startBtn = document.getElementById('startBtn');
      const retryBtn = document.getElementById('retryBtn');

      const timerEl = document.getElementById('timer');
      const qCountEl = document.getElementById('qCount');
      const dotsEl = document.getElementById('dots');

      const questionText = document.getElementById('questionText');
      const optionsEl = document.getElementById('options');

      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const submitBtn = document.getElementById('submitBtn');

      const ring = document.getElementById('ring');
      const scoreText = document.getElementById('scoreText');
      const passText = document.getElementById('passText');
      const correctText = document.getElementById('correctText');
      const totalText = document.getElementById('totalText');
      const marksText = document.getElementById('marksText');
      const nextDayBtn = document.getElementById('nextDayBtn');
      const reviewEl = document.getElementById('review');

      const setQuizState = (state) => {
        document.body.dataset.quizState = state;
        const allowed = document.querySelectorAll('.quiz-ad-allowed');
        if (state === 'in_progress') {
          // Hide all ads during quiz
          allowed.forEach(el => { el.style.display = 'none'; });
        } else {
          allowed.forEach(el => { el.style.display = ''; });
        }
      };

      const state = {
        questions: [],
        idx: 0,
        answers: {}, // {question_id: "A"}
        timeLeft: 600, // seconds (10 min default)
        interval: null,
        submitted: false
      };

      const renderDots = () => {
        dotsEl.innerHTML = state.questions.map((q, i) => {
          const answered = state.answers[q.id] ? 1 : 0;
          const active = i === state.idx ? 1 : 0;
          const cls = active ? 'bg-blue-600 text-white'
                    : answered ? 'bg-green-100 border border-green-300'
                    : 'bg-slate-100 border border-slate-200';
          return `<button class="dot ${cls}" data-dot="${i}" aria-label="Question ${i+1}">${i+1}</button>`;
        }).join('');
      };

      const renderQuestion = () => {
        const q = state.questions[state.idx];
        if (!q) return;

        qCountEl.textContent = `Question ${state.idx + 1} / ${state.questions.length}`;
        questionText.textContent = q.question;

        const selected = state.answers[q.id] || '';
        optionsEl.innerHTML = (q.options || []).map((optStr) => {
          // Expect options like "A) ..."
          const key = String(optStr).trim().charAt(0);
          const isSel = selected === key;
          return `
            <label class="option-row ${isSel ? 'selected' : ''}">
              <input type="radio" name="opt" value="${window.App.escapeHtml(key)}" ${isSel ? 'checked' : ''} />
              <span>${window.App.escapeHtml(optStr)}</span>
            </label>
          `;
        }).join('') || `<div class="text-sm text-slate-600">No options configured.</div>`;

        prevBtn.disabled = state.idx === 0;
        nextBtn.disabled = state.idx === state.questions.length - 1;
      };

      const fmt = (s) => {
        const mm = String(Math.floor(s/60)).padStart(2,'0');
        const ss = String(s%60).padStart(2,'0');
        return `${mm}:${ss}`;
      };

      const updateTimerUI = () => {
        timerEl.textContent = fmt(state.timeLeft);
        if (state.timeLeft <= 60) timerEl.classList.add('danger');
        else timerEl.classList.remove('danger');
      };

      const startTimer = () => {
        updateTimerUI();
        state.interval = setInterval(() => {
          state.timeLeft--;
          if (state.timeLeft < 0) state.timeLeft = 0;
          updateTimerUI();
          if (state.timeLeft === 0) {
            clearInterval(state.interval);
            if (!state.submitted) submitQuiz();
          }
        }, 1000);
      };

      const stopTimer = () => {
        if (state.interval) clearInterval(state.interval);
        state.interval = null;
      };

      const showResult = (result) => {
        state.submitted = true;
        stopTimer();

        setQuizState('result');

        startScreen.classList.add('hidden');
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');

        // Re-init ads (result screen only)
        window.AdManager?.init?.({ force: true });

        const score = Number(result.score_percent || 0);
        const passed = Number(result.passed || 0) === 1;

        scoreText.textContent = `${score}%`;
        passText.textContent = passed ? 'Passed ✅ (Next day unlock depends on lesson completion)' : 'Failed ❌ (Retry)';
        passText.className = passed ? 'text-green-700 font-semibold' : 'text-red-700 font-semibold';

        correctText.textContent = String(result.correct_count || 0);
        totalText.textContent = String(result.total_questions || 0);
        marksText.textContent = `${result.earned_marks || 0} / ${result.total_marks || 0}`;

        // ring animation
        const circ = 314;
        const off = circ - Math.round((score / 100) * circ);
        ring.style.stroke = passed ? '#22c55e' : '#ef4444';
        ring.style.transition = 'stroke-dashoffset 800ms ease';
        requestAnimationFrame(() => ring.style.strokeDashoffset = String(off));

        // Next day button (only if passed; actual unlock requires lesson complete as well)
        if (passed) {
          nextDayBtn.classList.remove('hidden');
          nextDayBtn.href = `/lesson.html?course=${encodeURIComponent(slug)}&day=${day+1}`;
        } else {
          nextDayBtn.classList.add('hidden');
        }

        // Review UI
        reviewEl.innerHTML = (result.details || []).map(d => {
          const ok = Number(d.is_correct) === 1;
          const your = d.your_answer || '(blank)';
          const correct = d.correct_answer || '';
          return `
            <div class="p-3 rounded border ${ok ? 'border-green-300 bg-green-50' : 'border-red-300 bg-red-50'}">
              <div class="font-semibold">${window.App.escapeHtml(d.question || '')}</div>
              <div class="mt-2 text-sm">
                <div>Your: <b class="${ok ? 'text-green-700' : 'text-red-700 line-through'}">${window.App.escapeHtml(String(your))}</b></div>
                <div>Correct: <b class="text-green-800">${window.App.escapeHtml(String(correct))}</b></div>
              </div>
              ${d.explanation ? `<div class="mt-2 text-xs p-2 rounded bg-white border border-slate-200">
                <b>Explanation:</b> ${window.App.escapeHtml(String(d.explanation))}
              </div>` : ''}
            </div>
          `;
        }).join('');
      };

      const submitQuiz = async () => {
        if (state.submitted) return;
        state.submitted = true;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        try {
          const res = await window.API.post('/api/quiz/submit.php', {
            course: slug,
            day,
            answers: state.answers
          });
          if (!res?.success) throw new Error(res?.message || 'Submit failed');
          showResult(res.data);
        } catch (e) {
          show(false, e.message || 'Submit failed');
          // allow retry submit
          state.submitted = false;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit';
        }
      };

      // Load quiz data
      let quizData = null;
      try {
        quizData = await window.API.get(`/api/quiz/get.php?course=${encodeURIComponent(slug)}&day=${day}`);
        if (!quizData?.success) throw new Error(quizData?.message || 'Failed');
        if (quizData.data.locked) {
          show(false, quizData.data.locked_reason || 'Locked');
        }
      } catch (e) {
        return show(false, e.message || 'Failed to load quiz');
      }

      if (quizData.data.locked) {
        // Keep start screen, but disable start
        startBtn.disabled = true;
        startBtn.classList.add('opacity-70');
        return;
      }

      state.questions = quizData.data.questions || [];

      startBtn.addEventListener('click', () => {
        if (!window.Auth.isLoggedIn()) {
          show(false, 'Please login first');
          return setTimeout(() => location.href = '/login.html', 600);
        }

        // Start quiz
        setQuizState('in_progress');
        startScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        resultScreen.classList.add('hidden');

        // Timer default: 10 minutes OR 60s * number_of_questions (min 3 min)
        const qCount = Math.max(1, state.questions.length);
        state.timeLeft = Math.max(180, qCount * 60);
        updateTimerUI();

        renderDots();
        renderQuestion();
        startTimer();
      });

      dotsEl.addEventListener('click', (ev) => {
        const b = ev.target.closest('button[data-dot]');
        if (!b) return;
        state.idx = Number(b.getAttribute('data-dot'));
        renderDots();
        renderQuestion();
      });

      optionsEl.addEventListener('change', (ev) => {
        const inp = ev.target.closest('input[type="radio"]');
        if (!inp) return;
        const q = state.questions[state.idx];
        if (!q) return;
        state.answers[q.id] = inp.value;
        renderDots();
        renderQuestion();
      });

      prevBtn.addEventListener('click', () => {
        state.idx = Math.max(0, state.idx - 1);
        renderDots();
        renderQuestion();
      });

      nextBtn.addEventListener('click', () => {
        state.idx = Math.min(state.questions.length - 1, state.idx + 1);
        renderDots();
        renderQuestion();
      });

      submitBtn.addEventListener('click', submitQuiz);

      retryBtn.addEventListener('click', () => {
        // Reload page for clean state
        location.reload();
      });
    });
  </script>
</body>
</html>
