<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — English Platform</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />

  <script src="/assets/js/ad-manager.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="container-page px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-bold text-lg">English Platform</a>
      <nav class="flex items-center gap-3 text-sm">
        <a href="/courses.html" class="hover:underline">Courses</a>
        <a href="/login.html" class="hover:underline">Login</a>
      </nav>
    </div>
    <div class="container-page px-4 pb-3">
      <div class="ad-slot" data-ad-slot="header"></div>
    </div>
  </header>

  <main class="container-page px-4 py-6">
    <div class="layout-grid">
      <aside class="sidebar-left"></aside>

      <section class="content">
        <article class="p-4 rounded bg-white border border-slate-200 max-w-xl">
          <h1 class="text-xl font-bold">Register</h1>
          <p class="text-sm text-slate-600 mt-1">Bangla: সঠিক BD phone format ব্যবহার করুন (01XXXXXXXXX)।</p>

          <div id="alert" class="hidden mt-4 p-3 rounded text-sm"></div>

          <form id="regForm" class="mt-4 space-y-3">
            <div>
              <label class="text-sm">Name</label>
              <input name="name" required minlength="2" maxlength="100"
                     class="w-full px-3 py-2 rounded bg-slate-50 border border-slate-200" />
            </div>

            <div>
              <label class="text-sm">Email</label>
              <input name="email" type="email" required
                     class="w-full px-3 py-2 rounded bg-slate-50 border border-slate-200" />
            </div>

            <div>
              <label class="text-sm">Phone (BD)</label>
              <input name="phone" required placeholder="01XXXXXXXXX"
                     class="w-full px-3 py-2 rounded bg-slate-50 border border-slate-200" />
              <p class="text-xs text-slate-500 mt-1">Valid: 013–019 দিয়ে শুরু, মোট 11 digit.</p>
            </div>

            <div>
              <label class="text-sm">Password</label>
              <input name="password" type="password" required minlength="8"
                     class="w-full px-3 py-2 rounded bg-slate-50 border border-slate-200" />
              <p class="text-xs text-slate-500 mt-1">Must include letter + number.</p>
            </div>

            <button class="w-full px-4 py-2 rounded bg-blue-600 text-white">Create Account</button>
          </form>

          <div class="mt-4 text-sm">
            Already have an account? <a class="text-blue-700 hover:underline" href="/login.html">Login</a>
          </div>

          <div class="mt-4 ad-slot" data-ad-slot="in_content" data-ad-index="0"></div>
        </article>

        <div class="mt-4 ad-slot" data-ad-slot="footer"></div>
      </section>

      <aside class="sidebar-right">
        <div class="ad-slot" data-ad-slot="sidebar_top"></div>
        <div class="mt-4 ad-slot" data-ad-slot="sidebar_bottom"></div>
      </aside>
    </div>
  </main>

  <div class="sticky-bottom-wrap">
    <div class="ad-slot sticky-bottom-ad" data-ad-slot="sticky_bottom"></div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.AdManager?.init?.();

      const form = document.getElementById('regForm');
      const alertBox = document.getElementById('alert');

      const show = (ok, msg) => {
        alertBox.className = 'mt-4 p-3 rounded text-sm ' + (ok ? 'bg-green-100 text-green-900' : 'bg-red-100 text-red-900');
        alertBox.textContent = msg;
        alertBox.classList.remove('hidden');
      };

      const bdPhoneRx = /^01[3-9]\d{8}$/;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('hidden');

        const fd = new FormData(form);
        const payload = {
          name: String(fd.get('name') || '').trim(),
          email: String(fd.get('email') || '').trim(),
          phone: String(fd.get('phone') || '').trim(),
          password: String(fd.get('password') || '')
        };

        if (!bdPhoneRx.test(payload.phone)) return show(false, 'Invalid BD phone format (01XXXXXXXXX)');

        try {
          const res = await window.Auth.register(payload);
          if (!res?.success) return show(false, res?.message || 'Register failed');
          show(true, 'Registered successfully. Redirecting...');
          setTimeout(() => location.href = '/dashboard.html', 700);
        } catch (err) {
          show(false, 'Network error');
        }
      });
    });
  </script>
</body>
</html>
