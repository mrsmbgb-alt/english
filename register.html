<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - English Learning Platform</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/auth.js" defer></script>
    <script src="/assets/js/app.js" defer></script>
</head>
<body class="bg-gradient-to-br from-purple-600 to-blue-500 min-h-screen flex items-center justify-center px-4 py-12">
    
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
        
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="/" class="text-3xl font-bold text-purple-600">EnglishBD</a>
            <p class="text-gray-600 mt-2">Create your free account</p>
        </div>
        
        <!-- Register Form -->
        <form id="register-form" class="space-y-5">
            
            <!-- Name -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name"
                    required
                    minlength="2"
                    maxlength="100"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    placeholder="Your full name"
                >
                <div id="name-error" class="text-red-500 text-sm mt-1 hidden"></div>
            </div>
            
            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    placeholder="your@email.com"
                >
                <div id="email-error" class="text-red-500 text-sm mt-1 hidden"></div>
            </div>
            
            <!-- Phone -->
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Phone Number (Optional)</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone"
                    pattern="^01[3-9]\d{8}$"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    placeholder="01XXXXXXXXX"
                >
                <div id="phone-error" class="text-red-500 text-sm mt-1 hidden"></div>
                <p class="text-xs text-gray-500 mt-1">Bangladeshi number (01XXXXXXXXX)</p>
            </div>
            
            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    required
                    minlength="8"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    placeholder="Create a strong password"
                >
                <div id="password-error" class="text-red-500 text-sm mt-1 hidden"></div>
                <p class="text-xs text-gray-500 mt-1">At least 8 characters with letters and numbers</p>
            </div>
            
            <!-- Submit Button -->
            <button 
                type="submit" 
                id="submit-btn"
                class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
            >
                Create Account
            </button>
            
        </form>
        
        <!-- Divider -->
        <div class="mt-6 text-center text-gray-600">
            Already have an account? 
            <a href="/login.html" class="text-purple-600 font-semibold hover:underline">Login</a>
        </div>
        
    </div>
    
    <script>
        const form = document.getElementById('register-form');
        const submitBtn = document.getElementById('submit-btn');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear previous errors
            ['name', 'email', 'phone', 'password'].forEach(field => {
                document.getElementById(`${field}-error`).classList.add('hidden');
            });
            
            // Get form data
            const userData = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                password: document.getElementById('password').value
            };
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';
            
            try {
                const response = await Auth.register(userData);
                
                App.showToast(response.message || 'Registration successful!', 'success');
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1000);
                
            } catch (error) {
                App.showToast(error.message || 'Registration failed', 'error');
                
                // Show field-specific errors from validation
                if (error.response && error.response.data && error.response.data.data && error.response.data.data.errors) {
                    const errors = error.response.data.data.errors;
                    
                    Object.keys(errors).forEach(field => {
                        const errorDiv = document.getElementById(`${field}-error`);
                        if (errorDiv) {
                            errorDiv.textContent = errors[field];
                            errorDiv.classList.remove('hidden');
                        }
                    });
                }
                
                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
