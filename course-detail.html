<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details - English Learning Platform</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/ad-manager.js" defer></script>
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/auth.js" defer></script>
    <script src="/assets/js/app.js" defer></script>
    
    <style>
        .curriculum-item {
            transition: all 0.2s;
        }
        
        .curriculum-item:hover {
            background: #f9fafb;
        }
    </style>
</head>
<body class="bg-gray-50">
    
    <!-- Header Ad -->
    <div data-ad-slot="header"></div>
    
    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-purple-600">EnglishBD</a>
            
            <div class="hidden md:flex space-x-6">
                <a href="/index.html" class="text-gray-700 hover:text-purple-600">Home</a>
                <a href="/courses.html" class="text-gray-700 hover:text-purple-600">Courses</a>
                <a href="/dashboard.html" class="text-gray-700 hover:text-purple-600">Dashboard</a>
            </div>
            
            <div id="nav-auth"></div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        
        <div id="course-detail-container" class="max-w-4xl mx-auto">
            <!-- Loading -->
            <div class="flex justify-center items-center py-24">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
            </div>
        </div>
        
    </div>
    
    <!-- In-Content Ad -->
    <div data-ad-slot="in_content" class="container mx-auto px-4 my-8"></div>
    
    <!-- Sidebar Ads (Desktop) -->
    <aside class="hidden lg:block fixed right-4 top-24 w-72">
        <div data-ad-slot="sidebar_top" class="mb-4"></div>
        <div data-ad-slot="sidebar_bottom"></div>
    </aside>
    
    <!-- Footer Ad -->
    <div data-ad-slot="footer" class="bg-gray-100 py-4 mt-12"></div>
    
    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 EnglishBD. All rights reserved.</p>
        </div>
    </footer>
    
    <!-- Sticky Bottom Ad (Mobile) -->
    <div data-ad-slot="sticky_bottom" class="lg:hidden"></div>
    
    <script>
        let courseData = null;
        let currentUser = null;
        
        async function init() {
            currentUser = await Auth.getUser();
            initNav(currentUser);
            
            const slug = App.getUrlParam('slug');
            if (!slug) {
                window.location.href = '/courses.html';
                return;
            }
            
            await loadCourseDetail(slug);
        }
        
        function initNav(user) {
            const navAuth = document.getElementById('nav-auth');
            
            if (user) {
                navAuth.innerHTML = `
                    <span class="text-gray-700 hidden md:inline">Hi, ${App.escapeHtml(user.name)}</span>
                    <button onclick="Auth.logout()" class="text-gray-700 hover:text-purple-600">Logout</button>
                `;
            } else {
                navAuth.innerHTML = `
                    <a href="/login.html" class="text-gray-700 hover:text-purple-600">Login</a>
                    <a href="/register.html" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">Sign Up</a>
                `;
            }
        }
        
        async function loadCourseDetail(slug) {
            const container = document.getElementById('course-detail-container');
            
            try {
                const response = await API.courses.detail(slug);
                courseData = response.data;
                
                const { course, is_enrolled, lesson_count, curriculum_preview } = courseData;
                
                container.innerHTML = `
                    <!-- Course Header -->
                    <div class="bg-white rounded-lg shadow-md overflow-hidden mb-8">
                        <img src="${course.thumbnail || '/assets/img/course-default.jpg'}" alt="${App.escapeHtml(course.title)}" class="w-full h-64 object-cover">
                        
                        <div class="p-8">
                            <div class="flex items-center gap-3 mb-4">
                                <span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-sm font-semibold">${App.escapeHtml(course.category)}</span>
                                <span class="bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-sm">${App.escapeHtml(course.level)}</span>
                                ${course.is_free ? '<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-semibold">FREE</span>' : ''}
                            </div>
                            
                            <h1 class="text-3xl md:text-4xl font-bold mb-4">${App.escapeHtml(course.title)}</h1>
                            
                            <p class="text-gray-600 text-lg mb-6">${App.escapeHtml(course.short_description)}</p>
                            
                            <!-- Stats -->
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                                <div class="text-center p-4 bg-gray-50 rounded-lg">
                                    <div class="text-2xl font-bold text-purple-600">${course.total_days}</div>
                                    <div class="text-sm text-gray-600">Days</div>
                                </div>
                                <div class="text-center p-4 bg-gray-50 rounded-lg">
                                    <div class="text-2xl font-bold text-purple-600">${lesson_count}</div>
                                    <div class="text-sm text-gray-600">Lessons</div>
                                </div>
                                <div class="text-center p-4 bg-gray-50 rounded-lg">
                                    <div class="text-2xl font-bold text-purple-600">${App.escapeHtml(course.level)}</div>
                                    <div class="text-sm text-gray-600">Level</div>
                                </div>
                                <div class="text-center p-4 bg-gray-50 rounded-lg">
                                    <div class="text-2xl font-bold text-purple-600">${course.is_free ? 'Free' : '$' + course.price}</div>
                                    <div class="text-sm text-gray-600">Price</div>
                                </div>
                            </div>
                            
                            <!-- Enroll Button -->
                            ${is_enrolled ? `
                                <a href="/lesson.html?slug=${course.slug}&day=1" class="block w-full md:w-auto md:inline-block text-center bg-green-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-green-700 transition">
                                    Continue Learning →
                                </a>
                            ` : `
                                <button onclick="enrollCourse('${course.slug}')" id="enroll-btn" class="w-full md:w-auto bg-purple-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-purple-700 transition">
                                    Enroll Now - It's Free!
                                </button>
                            `}
                        </div>
                    </div>
                    
                    <!-- Course Description -->
                    <div class="bg-white rounded-lg shadow-md p-8 mb-8">
                        <h2 class="text-2xl font-bold mb-4">About This Course</h2>
                        <div class="prose max-w-none text-gray-700">
                            ${course.description || course.short_description}
                        </div>
                    </div>
                    
                    <!-- Curriculum Preview -->
                    <div class="bg-white rounded-lg shadow-md p-8">
                        <h2 class="text-2xl font-bold mb-6">Course Curriculum</h2>
                        
                        <div class="space-y-2">
                            ${curriculum_preview.map(lesson => `
                                <div class="curriculum-item flex items-center justify-between p-4 border rounded-lg">
                                    <div class="flex items-center gap-4">
                                        <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center font-semibold text-purple-600">
                                            ${lesson.day_number}
                                        </div>
                                        <div>
                                            <h3 class="font-semibold">Day ${lesson.day_number}: ${App.escapeHtml(lesson.title)}</h3>
                                            <p class="text-sm text-gray-500">${lesson.estimated_minutes || 15} minutes</p>
                                        </div>
                                    </div>
                                    ${is_enrolled ? '' : '<svg class="w-5 h-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>'}
                                </div>
                            `).join('')}
                            
                            ${lesson_count > 3 ? `
                                <div class="text-center py-4 text-gray-500">
                                    + ${lesson_count - 3} more lessons
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                
            } catch (error) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <p class="text-red-500 mb-4">${error.message || 'Failed to load course'}</p>
                        <a href="/courses.html" class="text-purple-600 hover:underline">← Back to Courses</a>
                    </div>
                `;
            }
        }
        
        async function enrollCourse(slug) {
            if (!currentUser) {
                const returnUrl = encodeURIComponent(window.location.href);
                window.location.href = `/login.html?return=${returnUrl}`;
                return;
            }
            
            const btn = document.getElementById('enroll-btn');
            btn.disabled = true;
            btn.textContent = 'Enrolling...';
            
            try {
                const response = await API.courses.enroll(slug);
                
                App.showToast(response.message || 'Enrolled successfully!', 'success');
                
                // Redirect to first lesson
                setTimeout(() => {
                    window.location.href = `/lesson.html?slug=${slug}&day=1`;
                }, 1000);
                
            } catch (error) {
                App.showToast(error.message || 'Enrollment failed', 'error');
                btn.disabled = false;
                btn.textContent = 'Enroll Now - It\'s Free!';
            }
        }
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
