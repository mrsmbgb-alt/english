<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Course Detail — English Platform</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />

  <script src="/assets/js/ad-manager.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="container-page px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-bold text-lg">English Platform</a>
      <nav class="flex items-center gap-3 text-sm">
        <a href="/courses.html" class="hover:underline">Courses</a>
        <a href="/dashboard.html" class="hover:underline auth-only hidden">Dashboard</a>
        <a href="/login.html" class="hover:underline guest-only">Login</a>
        <button class="auth-only hidden px-3 py-1 rounded bg-slate-900 text-white" id="logoutBtn">Logout</button>
      </nav>
    </div>
    <div class="container-page px-4 pb-3">
      <div class="ad-slot" data-ad-slot="header"></div>
    </div>
  </header>

  <main class="container-page px-4 py-4">
    <div class="layout-grid">
      <aside class="sidebar-left"></aside>

      <section class="content">
        <article class="p-4 rounded bg-white border border-slate-200">
          <div id="skeleton" class="animate-pulse">
            <div class="h-6 bg-slate-200 rounded w-2/3"></div>
            <div class="h-4 bg-slate-200 rounded w-1/2 mt-3"></div>
            <div class="h-32 bg-slate-200 rounded mt-4"></div>
          </div>

          <div id="courseBox" class="hidden">
            <h1 id="title" class="text-xl font-bold"></h1>
            <div id="meta" class="text-xs text-slate-600 mt-1"></div>

            <div class="mt-4 flex flex-wrap gap-2">
              <button id="enrollBtn" class="px-4 py-2 rounded bg-green-600 text-white">Enroll</button>
              <a id="startBtn" class="px-4 py-2 rounded bg-blue-600 text-white hidden" href="#">Start / Continue</a>
            </div>

            <div id="alert" class="hidden mt-4 p-3 rounded text-sm"></div>

            <div class="mt-4 ad-slot" data-ad-slot="in_content" data-ad-index="0"></div>

            <h2 class="text-lg font-semibold mt-6">Overview</h2>
            <div id="desc" class="text-sm text-slate-700 mt-2 whitespace-pre-wrap"></div>

            <h2 class="text-lg font-semibold mt-6">Curriculum Preview</h2>
            <div id="preview" class="mt-2 text-sm"></div>

            <h2 class="text-lg font-semibold mt-6">Days</h2>
            <div id="days" class="mt-3 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2"></div>

            <div class="mt-4 ad-slot" data-ad-slot="in_content" data-ad-index="1"></div>
          </div>
        </article>

        <div class="mt-4 ad-slot" data-ad-slot="footer"></div>
      </section>

      <aside class="sidebar-right">
        <div class="ad-slot" data-ad-slot="sidebar_top"></div>
        <div class="mt-4 p-3 rounded bg-white border border-slate-200">
          <h3 class="font-semibold">Progress rule</h3>
          <p class="text-sm text-slate-700 mt-2">প্রতি দিন lesson complete + quiz passed (≥60%) হলে next day unlock হবে।</p>
        </div>
        <div class="mt-4 ad-slot" data-ad-slot="sidebar_bottom"></div>
      </aside>
    </div>
  </main>

  <div class="sticky-bottom-wrap">
    <div class="ad-slot sticky-bottom-ad" data-ad-slot="sticky_bottom"></div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      window.AdManager?.init?.();

      const qs = new URLSearchParams(location.search);
      const slug = qs.get('course') || '';

      const skeleton = document.getElementById('skeleton');
      const courseBox = document.getElementById('courseBox');

      const titleEl = document.getElementById('title');
      const metaEl = document.getElementById('meta');
      const descEl = document.getElementById('desc');
      const previewEl = document.getElementById('preview');
      const daysEl = document.getElementById('days');

      const enrollBtn = document.getElementById('enrollBtn');
      const startBtn = document.getElementById('startBtn');
      const alertBox = document.getElementById('alert');

      const show = (ok, msg) => {
        alertBox.className = 'mt-4 p-3 rounded text-sm ' + (ok ? 'bg-green-100 text-green-900' : 'bg-red-100 text-red-900');
        alertBox.textContent = msg;
        alertBox.classList.remove('hidden');
      };

      if (!slug) {
        skeleton.classList.add('hidden');
        courseBox.classList.remove('hidden');
        titleEl.textContent = 'Course not specified';
        return;
      }

      try {
        const res = await window.API.get('/api/courses/detail.php?course=' + encodeURIComponent(slug));
        if (!res?.success) throw new Error(res?.message || 'Failed');

        const { course, enrollment, lessons_preview, days } = res.data;

        skeleton.classList.add('hidden');
        courseBox.classList.remove('hidden');

        titleEl.textContent = course.title;
        metaEl.textContent = `Days: ${course.total_days} · Level: ${course.level} · Category: ${course.category || ''}`;

        descEl.textContent = course.description || course.short_description || '';

        // Preview lessons
        previewEl.innerHTML = (lessons_preview || []).map(l => `
          <div class="p-2 rounded border border-slate-200 bg-slate-50 mb-2">
            <div class="font-semibold text-sm">Day ${l.day_number}: ${window.App.escapeHtml(l.title)}</div>
            <div class="text-xs text-slate-600">Estimated: ${Number(l.estimated_minutes || 0)} min</div>
          </div>
        `).join('') || `<div class="text-slate-600">No lessons published yet.</div>`;

        // Enrollment buttons
        const isEnrolled = !!enrollment;
        enrollBtn.classList.toggle('hidden', isEnrolled);
        startBtn.classList.toggle('hidden', !isEnrolled);

        if (isEnrolled) {
          // Find first unlocked day
          const firstUnlocked = (days || []).find(d => !d.locked)?.day_number || 1;
          startBtn.href = `/lesson.html?course=${encodeURIComponent(slug)}&day=${firstUnlocked}`;
        }

        // Day grid with lock
        daysEl.innerHTML = (days || []).map(d => {
          const locked = !!d.locked;
          const done = Number(d.lesson_completed) === 1 && Number(d.quiz_passed) === 1;
          const cls = done ? 'bg-green-100 border-green-300 text-green-900'
                    : locked ? 'bg-slate-100 border-slate-200 text-slate-500'
                    : 'bg-white border-slate-200 hover:border-blue-400';
          const label = locked ? `Day ${d.day_number} 🔒` : `Day ${d.day_number}`;
          const href = locked ? '#' : `/lesson.html?course=${encodeURIComponent(slug)}&day=${d.day_number}`;
          return `
            <a href="${href}" class="day-chip ${cls}" ${locked ? `title="${window.App.escapeHtml(d.locked_reason || 'Locked')}" onclick="event.preventDefault();"` : ''}>
              ${label}
            </a>
          `;
        }).join('');

        enrollBtn.addEventListener('click', async () => {
          if (!window.Auth.isLoggedIn()) {
            show(false, 'Please login to enroll');
            return setTimeout(() => location.href = '/login.html', 700);
          }
          enrollBtn.disabled = true;
          enrollBtn.textContent = 'Enrolling...';
          try {
            const r = await window.API.post('/api/courses/enroll.php', { course: slug });
            if (!r?.success) throw new Error(r?.message || 'Enroll failed');
            show(true, 'Enrolled! Reloading...');
            setTimeout(() => location.reload(), 600);
          } catch (e) {
            enrollBtn.disabled = false;
            enrollBtn.textContent = 'Enroll';
            show(false, e.message || 'Enroll failed');
          }
        });

      } catch (e) {
        skeleton.classList.add('hidden');
        courseBox.classList.remove('hidden');
        titleEl.textContent = 'Failed to load course';
        show(false, e.message || 'Error');
      }
    });
  </script>
</body>
</html>
