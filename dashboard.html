<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - English Learning Platform</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/ad-manager.js" defer></script>
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/auth.js" defer></script>
    <script src="/assets/js/app.js" defer></script>
    
    <style>
        .course-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .progress-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    
    <!-- Header Ad -->
    <div data-ad-slot="header"></div>
    
    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-purple-600">EnglishBD</a>
            
            <div class="hidden md:flex space-x-6">
                <a href="/index.html" class="text-gray-700 hover:text-purple-600">Home</a>
                <a href="/courses.html" class="text-gray-700 hover:text-purple-600">Courses</a>
                <a href="/dashboard.html" class="text-purple-600 font-semibold">Dashboard</a>
            </div>
            
            <div id="nav-auth" class="flex space-x-3">
                <!-- Populated by JS -->
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        
        <!-- Welcome Section -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome back, <span id="user-name">Student</span>!</h1>
            <p class="text-gray-600">Continue your learning journey</p>
        </div>
        
        <!-- Stats Cards -->
        <div id="stats-container" class="grid md:grid-cols-4 gap-6 mb-8">
            <!-- Loading -->
            <div class="col-span-4 flex justify-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
            </div>
        </div>
        
        <!-- In-Content Ad #1 -->
        <div data-ad-slot="in_content" class="my-8"></div>
        
        <!-- Continue Learning -->
        <section class="mb-12">
            <h2 class="text-2xl font-bold mb-6">Continue Learning</h2>
            <div id="continuing-courses" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Populated by JS -->
            </div>
        </section>
        
        <!-- In-Content Ad #2 -->
        <div data-ad-slot="in_content" class="my-8"></div>
        
        <!-- All Courses -->
        <section>
            <h2 class="text-2xl font-bold mb-6">All My Courses</h2>
            <div id="all-courses" class="space-y-4">
                <!-- Populated by JS -->
            </div>
        </section>
        
    </div>
    
    <!-- Sidebar Ads (Desktop) -->
    <aside class="hidden lg:block fixed right-4 top-24 w-72">
        <div data-ad-slot="sidebar_top" class="mb-4"></div>
        <div data-ad-slot="sidebar_bottom"></div>
    </aside>
    
    <!-- Footer Ad -->
    <div data-ad-slot="footer" class="bg-gray-100 py-4 mt-12"></div>
    
    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 EnglishBD. All rights reserved.</p>
        </div>
    </footer>
    
    <!-- Sticky Bottom Ad (Mobile) -->
    <div data-ad-slot="sticky_bottom" class="lg:hidden"></div>
    
    <script>
        let dashboardData = null;
        
        // Initialize
        async function init() {
            const user = await Auth.requireLogin();
            if (!user) return;
            
            initNav(user);
            document.getElementById('user-name').textContent = user.name;
            
            await loadDashboard();
        }
        
        // Initialize navigation
        function initNav(user) {
            const navAuth = document.getElementById('nav-auth');
            navAuth.innerHTML = `
                <span class="text-gray-700 hidden md:inline">Hi, ${App.escapeHtml(user.name)}</span>
                <button onclick="Auth.logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                    Logout
                </button>
            `;
        }
        
        // Load dashboard data
        async function loadDashboard() {
            try {
                const response = await API.progress.dashboard();
                dashboardData = response.data;
                
                renderStats(dashboardData.stats);
                renderContinuingCourses(dashboardData.continuing);
                renderAllCourses(dashboardData.all_courses);
                
            } catch (error) {
                App.showToast('Failed to load dashboard', 'error');
                console.error(error);
            }
        }
        
        // Render stats
        function renderStats(stats) {
            const container = document.getElementById('stats-container');
            
            container.innerHTML = `
                <div class="stat-card text-white rounded-lg p-6 shadow-lg">
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <div class="text-3xl font-bold">${stats.enrolled_courses}</div>
                            <div class="text-sm opacity-90">Enrolled Courses</div>
                        </div>
                        <svg class="w-12 h-12 opacity-50" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3zM3.31 9.397L5 10.12v4.102a8.969 8.969 0 00-1.05-.174 1 1 0 01-.89-.89 11.115 11.115 0 01.25-3.762zM9.3 16.573A9.026 9.026 0 007 14.935v-3.957l1.818.78a3 3 0 002.364 0l5.508-2.361a11.026 11.026 0 01.25 3.762 1 1 0 01-.89.89 8.968 8.968 0 00-5.35 2.524 1 1 0 01-1.4 0zM6 18a1 1 0 001-1v-2.065a8.935 8.935 0 00-2-.712V17a1 1 0 001 1z"></path>
                        </svg>
                    </div>
                </div>
                
                <div class="bg-white rounded-lg p-6 shadow-md border-l-4 border-green-500">
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <div class="text-3xl font-bold text-green-600">${stats.completed_courses}</div>
                            <div class="text-sm text-gray-600">Completed</div>
                        </div>
                        <svg class="w-12 h-12 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                </div>
                
                <div class="bg-white rounded-lg p-6 shadow-md border-l-4 border-blue-500">
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <div class="text-3xl font-bold text-blue-600">${stats.completed_days}</div>
                            <div class="text-sm text-gray-600">Days Completed</div>
                        </div>
                        <svg class="w-12 h-12 text-blue-500" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                </div>
                
                <div class="bg-white rounded-lg p-6 shadow-md border-l-4 border-orange-500">
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <div class="text-3xl font-bold text-orange-600">${stats.current_streak}</div>
                            <div class="text-sm text-gray-600">Day Streak 🔥</div>
                        </div>
                        <svg class="w-12 h-12 text-orange-500" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1011.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 017 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A2.99 2.99 0 0113 13a2.99 2.99 0 01-.879 2.121z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                </div>
            `;
        }
        
        // Render continuing courses
        function renderContinuingCourses(courses) {
            const container = document.getElementById('continuing-courses');
            
            if (courses.length === 0) {
                container.innerHTML = `
                    <div class="col-span-3 text-center py-12 bg-white rounded-lg shadow-md">
                        <svg class="w-16 h-16 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                        <p class="text-gray-600 mb-4">You haven't enrolled in any courses yet</p>
                        <a href="/courses.html" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 inline-block">
                            Browse Courses
                        </a>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = courses.map(course => `
                <div class="course-card bg-white rounded-lg shadow-md overflow-hidden">
                    <img src="${course.thumbnail || '/assets/img/course-default.jpg'}" alt="${App.escapeHtml(course.title)}" class="w-full h-40 object-cover">
                    <div class="p-6">
                        <h3 class="text-lg font-bold mb-2">${App.escapeHtml(course.title)}</h3>
                        
                        <div class="mb-4">
                            <div class="flex justify-between text-sm text-gray-600 mb-1">
                                <span>Progress</span>
                                <span>${course.progress_percentage}%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${course.progress_percentage}%"></div>
                            </div>
                        </div>
                        
                        <div class="flex justify-between items-center text-sm text-gray-600 mb-4">
                            <span>${course.completed_days} / ${course.total_days} days</span>
                        </div>
                        
                        ${course.next_day ? `
                            <a href="/lesson.html?slug=${course.slug}&day=${course.next_day}" class="block w-full bg-purple-600 text-white text-center px-4 py-2 rounded hover:bg-purple-700 transition">
                                Continue Day ${course.next_day} →
                            </a>
                        ` : `
                            <div class="bg-green-100 text-green-700 text-center px-4 py-2 rounded font-semibold">
                                ✓ Course Completed!
                            </div>
                        `}
                    </div>
                </div>
            `).join('');
        }
        
        // Render all courses
        function renderAllCourses(courses) {
            const container = document.getElementById('all-courses');
            
            if (courses.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-lg shadow-md">
                        <p class="text-gray-600">No courses enrolled</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = courses.map(course => `
                <div class="bg-white rounded-lg shadow-md p-6">
                    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                        <div class="flex items-start gap-4 flex-1">
                            <img src="${course.thumbnail || '/assets/img/course-default.jpg'}" alt="${App.escapeHtml(course.title)}" class="w-20 h-20 rounded object-cover">
                            <div class="flex-1">
                                <h3 class="text-lg font-bold mb-1">${App.escapeHtml(course.title)}</h3>
                                <div class="flex items-center gap-3 text-sm text-gray-600 mb-2">
                                    <span class="bg-gray-100 px-2 py-1 rounded">${App.escapeHtml(course.category)}</span>
                                    <span class="bg-gray-100 px-2 py-1 rounded">${App.escapeHtml(course.level)}</span>
                                    <span>${course.total_days} days</span>
                                </div>
                                
                                <div class="flex items-center gap-4">
                                    <div class="flex-1 max-w-xs">
                                        <div class="progress-bar">
                                            <div class="progress-fill" style="width: ${course.progress_percentage}%"></div>
                                        </div>
                                    </div>
                                    <span class="text-sm font-semibold text-purple-600">${course.progress_percentage}%</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex gap-2">
                            ${course.enrollment_status === 'completed' ? `
                                <span class="bg-green-100 text-green-700 px-4 py-2 rounded font-semibold whitespace-nowrap">
                                    ✓ Completed
                                </span>
                            ` : `
                                <a href="/progress.html?slug=${course.slug}" class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 transition whitespace-nowrap">
                                    View Progress
                                </a>
                                <a href="/lesson.html?slug=${course.slug}&day=1" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 transition whitespace-nowrap">
                                    Continue →
                                </a>
                            `}
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
