<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard — English Platform</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />

  <script src="/assets/js/ad-manager.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="container-page px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-bold text-lg">English Platform</a>
      <nav class="flex items-center gap-3 text-sm">
        <a href="/courses.html" class="hover:underline">Courses</a>
        <a href="/dashboard.html" class="hover:underline font-semibold">Dashboard</a>
        <a href="/progress.html" class="hover:underline">Progress</a>
        <button class="auth-only hidden px-3 py-1 rounded bg-slate-900 text-white" id="logoutBtn">Logout</button>
      </nav>
    </div>

    <div class="container-page px-4 pb-3">
      <div class="ad-slot" data-ad-slot="header"></div>
    </div>
  </header>

  <main class="container-page px-4 py-4">
    <div class="layout-grid">
      <aside class="sidebar-left">
        <div class="p-3 rounded bg-white border border-slate-200">
          <h3 class="font-semibold">Menu</h3>
          <ul class="text-sm mt-2 space-y-1">
            <li><a class="hover:underline" href="/courses.html">Browse Courses</a></li>
            <li><a class="hover:underline" href="/progress.html">Progress</a></li>
          </ul>
          <div class="mt-4 ad-slot" data-ad-slot="sidebar_top"></div>
        </div>
      </aside>

      <section class="content">
        <article class="p-4 rounded bg-white border border-slate-200">
          <h1 class="text-xl font-bold">Dashboard</h1>
          <p class="text-sm text-slate-600 mt-1">Bangla: Continue learning & keep your streak.</p>

          <div class="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="p-3 rounded bg-slate-50 border border-slate-200">
              <div class="text-xs text-slate-600">Enrolled</div>
              <div id="statEnrolled" class="text-2xl font-bold">0</div>
            </div>
            <div class="p-3 rounded bg-slate-50 border border-slate-200">
              <div class="text-xs text-slate-600">Completed Days</div>
              <div id="statCompleted" class="text-2xl font-bold">0</div>
            </div>
            <div class="p-3 rounded bg-slate-50 border border-slate-200">
              <div class="text-xs text-slate-600">Streak</div>
              <div id="statStreak" class="text-2xl font-bold">0</div>
            </div>
          </div>

          <div class="mt-4 ad-slot" data-ad-slot="in_content" data-ad-index="0"></div>

          <h2 class="text-lg font-semibold mt-6">Continue Learning</h2>
          <div id="continueList" class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3"></div>

          <h2 class="text-lg font-semibold mt-6">All Enrolled Courses</h2>
          <div id="courseProgress" class="mt-3 space-y-2"></div>

          <div class="mt-4 ad-slot" data-ad-slot="in_content" data-ad-index="1"></div>
        </article>

        <div class="mt-4 ad-slot" data-ad-slot="footer"></div>
      </section>

      <aside class="sidebar-right">
        <div class="ad-slot" data-ad-slot="sidebar_top"></div>
        <div class="mt-4 p-3 rounded bg-white border border-slate-200">
          <h3 class="font-semibold">Tip</h3>
          <p class="text-sm text-slate-700 mt-2">প্রতিদিন একই সময়ে quiz দিলে streak build হবে।</p>
        </div>
        <div class="mt-4 ad-slot" data-ad-slot="sidebar_bottom"></div>
      </aside>
    </div>
  </main>

  <div class="sticky-bottom-wrap">
    <div class="ad-slot sticky-bottom-ad" data-ad-slot="sticky_bottom"></div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      if (!window.Auth.isLoggedIn()) {
        location.href = '/login.html';
        return;
      }

      window.AdManager?.init?.();

      const enrolledEl = document.getElementById('statEnrolled');
      const completedEl = document.getElementById('statCompleted');
      const streakEl = document.getElementById('statStreak');

      const continueEl = document.getElementById('continueList');
      const progEl = document.getElementById('courseProgress');

      try {
        const res = await window.API.get('/api/progress/dashboard.php');
        if (!res?.success) throw new Error(res?.message || 'Failed');

        const { stats, continue_learning, courses } = res.data;

        enrolledEl.textContent = String(stats.enrolled_courses || 0);
        completedEl.textContent = String(stats.completed_days || 0);
        streakEl.textContent = String(stats.streak || 0);

        continueEl.innerHTML = (continue_learning || []).map(c => `
          <a class="p-3 rounded border border-slate-200 bg-white hover:border-blue-400 block"
             href="/lesson.html?course=${encodeURIComponent(c.slug)}&day=${Number(c.day_to_continue || 1)}">
            <div class="font-semibold">${window.App.escapeHtml(c.title)}</div>
            <div class="text-xs text-slate-600 mt-1">Continue: Day ${Number(c.day_to_continue || 1)}</div>
            <div class="mt-2 h-2 bg-slate-200 rounded">
              <div class="h-2 bg-blue-600 rounded" style="width:${Number(c.progress_percent||0)}%"></div>
            </div>
            <div class="text-xs text-slate-500 mt-1">${Number(c.progress_percent||0)}%</div>
          </a>
        `).join('') || `<div class="text-sm text-slate-600">No active courses. <a class="text-blue-700 underline" href="/courses.html">Enroll now</a>.</div>`;

        progEl.innerHTML = (courses || []).map(c => `
          <div class="p-3 rounded border border-slate-200 bg-slate-50">
            <div class="flex items-center justify-between gap-3">
              <div>
                <div class="font-semibold">${window.App.escapeHtml(c.title)}</div>
                <div class="text-xs text-slate-600">Completed ${Number(c.completed_days||0)} / ${Number(c.total_days||0)} days</div>
              </div>
              <a class="px-3 py-2 rounded bg-slate-900 text-white text-sm"
                 href="/course-detail.html?course=${encodeURIComponent(c.slug)}">Open</a>
            </div>
            <div class="mt-2 h-2 bg-slate-200 rounded">
              <div class="h-2 bg-green-600 rounded" style="width:${Number(c.progress_percent||0)}%"></div>
            </div>
          </div>
        `).join('') || '';
      } catch (e) {
        continueEl.innerHTML = `<div class="text-sm text-red-700">Failed to load dashboard.</div>`;
      }
    });
  </script>
</body>
</html>
