<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Progress — English Platform</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />

  <script src="/assets/js/ad-manager.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="container-page px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-bold text-lg">English Platform</a>
      <nav class="flex items-center gap-3 text-sm">
        <a href="/courses.html" class="hover:underline">Courses</a>
        <a href="/dashboard.html" class="hover:underline">Dashboard</a>
        <a href="/progress.html" class="hover:underline font-semibold">Progress</a>
        <button class="auth-only hidden px-3 py-1 rounded bg-slate-900 text-white" id="logoutBtn">Logout</button>
      </nav>
    </div>

    <div class="container-page px-4 pb-3">
      <div class="ad-slot" data-ad-slot="header"></div>
    </div>
  </header>

  <main class="container-page px-4 py-4">
    <div class="layout-grid">
      <aside class="sidebar-left">
        <div class="p-3 rounded bg-white border border-slate-200">
          <h3 class="font-semibold">Select Course</h3>
          <select id="courseSel" class="mt-2 w-full px-3 py-2 rounded bg-slate-50 border border-slate-200 text-sm"></select>
          <p class="mt-3 text-xs text-slate-600">Bangla: Course select করলে day-grid progress দেখাবে।</p>
        </div>
      </aside>

      <section class="content">
        <article class="p-4 rounded bg-white border border-slate-200">
          <h1 class="text-xl font-bold">Progress</h1>
          <p class="text-sm text-slate-600 mt-1">Day grid: completed ✅, locked 🔒</p>

          <div class="mt-4 ad-slot" data-ad-slot="in_content" data-ad-index="0"></div>

          <div id="gridWrap" class="mt-4">
            <div id="courseInfo" class="text-sm text-slate-700"></div>
            <div id="grid" class="mt-3 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2"></div>
          </div>

          <div class="mt-4 ad-slot" data-ad-slot="in_content" data-ad-index="1"></div>
        </article>

        <div class="mt-4 ad-slot" data-ad-slot="footer"></div>
      </section>

      <aside class="sidebar-right">
        <div class="ad-slot" data-ad-slot="sidebar_top"></div>
        <div class="mt-4 p-3 rounded bg-white border border-slate-200">
          <h3 class="font-semibold">Legend</h3>
          <div class="text-sm text-slate-700 mt-2 space-y-1">
            <div>✅ Completed: lesson + quiz passed</div>
            <div>🔒 Locked: previous day incomplete</div>
          </div>
        </div>
        <div class="mt-4 ad-slot" data-ad-slot="sidebar_bottom"></div>
      </aside>
    </div>
  </main>

  <div class="sticky-bottom-wrap">
    <div class="ad-slot sticky-bottom-ad" data-ad-slot="sticky_bottom"></div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      if (!window.Auth.isLoggedIn()) {
        location.href = '/login.html';
        return;
      }

      window.AdManager?.init?.();

      const courseSel = document.getElementById('courseSel');
      const infoEl = document.getElementById('courseInfo');
      const grid = document.getElementById('grid');

      let courses = [];

      const loadDashboard = async () => {
        const res = await window.API.get('/api/progress/dashboard.php');
        if (!res?.success) throw new Error(res?.message || 'Failed');
        courses = res.data.courses || [];
      };

      const renderCourses = () => {
        courseSel.innerHTML = courses.map(c => `
          <option value="${window.App.escapeHtml(String(c.slug))}">
            ${window.App.escapeHtml(c.title)} (${Number(c.completed_days||0)}/${Number(c.total_days||0)})
          </option>
        `).join('');
      };

      const loadCourseGrid = async (slug) => {
        infoEl.textContent = 'Loading...';
        grid.innerHTML = '';
        const res = await window.API.get('/api/progress/course.php?course=' + encodeURIComponent(slug));
        if (!res?.success) throw new Error(res?.message || 'Failed');

        const total = Number(res.data.course?.total_days || 0);
        infoEl.textContent = `Course: ${slug} · Total days: ${total}`;

        grid.innerHTML = (res.data.days || []).map(d => {
          const locked = Number(d.locked) === 1;
          const done = Number(d.lesson_completed) === 1 && Number(d.quiz_passed) === 1;
          const cls = done ? 'bg-green-100 border-green-300 text-green-900'
                    : locked ? 'bg-slate-100 border-slate-200 text-slate-500'
                    : 'bg-white border-slate-200 hover:border-blue-400';
          const label = locked ? `Day ${d.day_number} 🔒` : `Day ${d.day_number}`;
          const href = locked ? '#' : `/lesson.html?course=${encodeURIComponent(slug)}&day=${d.day_number}`;
          return `<a class="day-chip ${cls}" href="${href}" ${locked ? `onclick="event.preventDefault();"` : ''}>${label}</a>`;
        }).join('');
      };

      try {
        await loadDashboard();
        if (!courses.length) {
          infoEl.textContent = 'No enrolled courses. Enroll from Courses page.';
          return;
        }
        renderCourses();
        await loadCourseGrid(courses[0].slug);

        courseSel.addEventListener('change', async () => {
          await loadCourseGrid(courseSel.value);
        });
      } catch (e) {
        infoEl.textContent = 'Failed to load progress';
      }
    });
  </script>
</body>
</html>
