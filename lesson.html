<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson - English Learning Platform</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/ad-manager.js" defer></script>
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/auth.js" defer></script>
    <script src="/assets/js/app.js" defer></script>
    
    <style>
        /* Lesson content typography */
        .lesson-content {
            line-height: 1.8;
        }
        
        .lesson-content h2 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: #1f2937;
        }
        
        .lesson-content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: #374151;
        }
        
        .lesson-content p {
            margin-bottom: 1rem;
            color: #4b5563;
        }
        
        .lesson-content ul, .lesson-content ol {
            margin-left: 2rem;
            margin-bottom: 1rem;
        }
        
        .lesson-content li {
            margin-bottom: 0.5rem;
            color: #4b5563;
        }
        
        .lesson-content strong {
            font-weight: 600;
            color: #1f2937;
        }
        
        .lesson-content img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin: 1.5rem 0;
        }
        
        .lesson-content code {
            background: #f3f4f6;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-family: monospace;
        }
        
        /* Progress bar */
        .progress-bar {
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }
        
        /* Video aspect ratio */
        .aspect-video {
            aspect-ratio: 16 / 9;
        }
        
        /* Day grid */
        .day-item {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .day-item.locked {
            background: #e5e7eb;
            color: #9ca3af;
            cursor: not-allowed;
        }
        
        .day-item.unlocked {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .day-item.unlocked:hover {
            background: #bfdbfe;
        }
        
        .day-item.completed {
            background: #d1fae5;
            color: #065f46;
        }
        
        .day-item.current {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
    </style>
</head>
<body class="bg-gray-50">
    
    <!-- Header Ad -->
    <div data-ad-slot="header"></div>
    
    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-purple-600">EnglishBD</a>
            
            <div class="flex items-center space-x-4">
                <a href="/dashboard.html" class="text-gray-700 hover:text-purple-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </a>
                <div id="nav-auth"></div>
            </div>
        </div>
    </nav>
    
    <!-- Progress Bar (Sticky) -->
    <div id="progress-container" class="bg-white shadow-sm sticky top-16 z-30 px-4 py-3">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex-1 mr-4">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                </div>
            </div>
            <span id="progress-text" class="text-sm font-semibold text-gray-600">Day 1 / 30</span>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        <div class="grid lg:grid-cols-4 gap-8">
            
            <!-- Main Lesson Column -->
            <div class="lg:col-span-3">
                
                <!-- Lesson Container -->
                <div id="lesson-container" class="bg-white rounded-lg shadow-md p-8">
                    <!-- Loading state -->
                    <div class="flex justify-center items-center py-12">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
                    </div>
                </div>
                
                <!-- In-Content Ad #1 -->
                <div data-ad-slot="in_content" class="my-8"></div>
                
                <!-- Actions -->
                <div id="lesson-actions" class="bg-white rounded-lg shadow-md p-6 mt-6 hidden">
                    <div class="flex items-center justify-between">
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" id="mark-complete" class="w-5 h-5 text-purple-600 rounded focus:ring-purple-500">
                            <span class="text-gray-700 font-medium">I've completed this lesson</span>
                        </label>
                        
                        <a id="quiz-link" href="#" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                            Take Quiz →
                        </a>
                    </div>
                </div>
                
                <!-- In-Content Ad #2 -->
                <div data-ad-slot="in_content" class="my-8"></div>
                
            </div>
            
            <!-- Sidebar -->
            <div class="lg:col-span-1">
                
                <!-- Sidebar Top Ad (Desktop) -->
                <div data-ad-slot="sidebar_top" class="hidden lg:block mb-6"></div>
                
                <!-- Course Navigation -->
                <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                    <h3 class="font-bold text-lg mb-4">Course Progress</h3>
                    <div id="day-grid" class="grid grid-cols-6 gap-2">
                        <!-- Populated by JS -->
                    </div>
                </div>
                
                <!-- Sidebar Bottom Ad (Desktop) -->
                <div data-ad-slot="sidebar_bottom" class="hidden lg:block"></div>
                
            </div>
        </div>
    </div>
    
    <!-- Footer Ad -->
    <div data-ad-slot="footer" class="bg-gray-100 py-4 mt-12"></div>
    
    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 EnglishBD. All rights reserved.</p>
        </div>
    </footer>
    
    <!-- Sticky Bottom Ad (Mobile) -->
    <div data-ad-slot="sticky_bottom" class="lg:hidden"></div>
    
    <script>
        let currentCourse = null;
        let currentDay = null;
        let lessonData = null;
        
        // Initialize
        async function init() {
            const user = await Auth.requireLogin();
            if (!user) return;
            
            // Get course and day from URL
            const pathParts = window.location.pathname.split('/');
            const urlParams = new URLSearchParams(window.location.search);
            
            // Support both /lesson/slug/day and /lesson.html?slug=xxx&day=N
            if (pathParts.length >= 4 && pathParts[1] === 'lesson') {
                currentCourse = pathParts[2];
                currentDay = parseInt(pathParts[3]);
            } else {
                currentCourse = urlParams.get('slug');
                currentDay = parseInt(urlParams.get('day') || '1');
            }
            
            if (!currentCourse || !currentDay) {
                App.showToast('Invalid lesson URL', 'error');
                setTimeout(() => window.location.href = '/courses.html', 2000);
                return;
            }
            
            initNav(user);
            await loadLesson();
        }
        
        // Initialize navigation
        function initNav(user) {
            const navAuth = document.getElementById('nav-auth');
            navAuth.innerHTML = `
                <span class="text-gray-700 hidden md:inline">Hi, ${App.escapeHtml(user.name)}</span>
                <button onclick="Auth.logout()" class="text-gray-700 hover:text-purple-600">
                    Logout
                </button>
            `;
        }
        
        // Load lesson
        async function loadLesson() {
            const container = document.getElementById('lesson-container');
            
            try {
                const response = await API.lessons.get(currentCourse, currentDay);
                lessonData = response.data;
                
                const { course, lesson, progress } = lessonData;
                
                // Update progress bar
                const progressPercentage = (currentDay / course.total_days) * 100;
                document.getElementById('progress-fill').style.width = `${progressPercentage}%`;
                document.getElementById('progress-text').textContent = `Day ${currentDay} / ${course.total_days}`;
                
                // Render lesson
                container.innerHTML = `
                    <div class="mb-6">
                        <span class="text-sm font-semibold text-purple-600 uppercase">${App.escapeHtml(course.title)}</span>
                        <h1 class="text-3xl font-bold mt-2 mb-4">Day ${currentDay}: ${App.escapeHtml(lesson.title)}</h1>
                        <div class="flex items-center text-sm text-gray-500">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <span>${lesson.estimated_minutes || 15} minutes</span>
                        </div>
                    </div>
                    
                    ${lesson.video_url ? `
                        <div class="mb-8">
                            <iframe 
                                src="${lesson.video_url}" 
                                class="w-full aspect-video rounded-lg shadow-md"
                                frameborder="0"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                allowfullscreen
                            ></iframe>
                        </div>
                    ` : ''}
                    
                    <div class="lesson-content">
                        ${lesson.content || '<p>No content available.</p>'}
                    </div>
                    
                    ${lesson.pdf_url ? `
                        <div class="mt-8 bg-blue-50 border border-blue-200 rounded-lg p-6">
                            <h3 class="font-semibold text-lg mb-3">📄 Download Study Material</h3>
                            <a href="${lesson.pdf_url}" target="_blank" class="inline-flex items-center text-blue-600 hover:text-blue-800">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                </svg>
                                Download PDF
                            </a>
                        </div>
                    ` : ''}
                `;
                
                // Show actions
                const actionsContainer = document.getElementById('lesson-actions');
                actionsContainer.classList.remove('hidden');
                
                const markCompleteCheckbox = document.getElementById('mark-complete');
                const quizLink = document.getElementById('quiz-link');
                
                // Set checkbox state
                if (progress.lesson_completed) {
                    markCompleteCheckbox.checked = true;
                }
                
                // Update quiz link
                quizLink.href = `/quiz.html?slug=${currentCourse}&day=${currentDay}`;
                
                if (!progress.lesson_completed) {
                    quizLink.classList.add('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
                    quizLink.textContent = 'Complete lesson first';
                }
                
                // Mark complete handler
                markCompleteCheckbox.addEventListener('change', async (e) => {
                    if (e.target.checked) {
                        try {
                            await API.lessons.complete(course.id, currentDay);
                            App.showToast('Lesson marked as complete!', 'success');
                            
                            // Enable quiz link
                            quizLink.classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
                            quizLink.textContent = 'Take Quiz →';
                            
                        } catch (error) {
                            App.showToast(error.message || 'Failed to mark complete', 'error');
                            e.target.checked = false;
                        }
                    }
                });
                
                // Load day grid
                await loadDayGrid(course.id, course.slug, course.total_days);
                
            } catch (error) {
                if (error.message.includes('locked')) {
                    container.innerHTML = `
                        <div class="text-center py-12">
                            <svg class="w-24 h-24 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                            <h2 class="text-2xl font-bold text-gray-700 mb-2">This Lesson is Locked</h2>
                            <p class="text-gray-600 mb-6">Complete the previous day's lesson and quiz to unlock this day.</p>
                            <a href="/dashboard.html" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700">
                                Back to Dashboard
                            </a>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="text-center py-12">
                            <p class="text-red-500 mb-4">${error.message || 'Failed to load lesson'}</p>
                            <a href="/dashboard.html" class="text-purple-600 hover:underline">Back to Dashboard</a>
                        </div>
                    `;
                }
            }
        }
        
        // Load day grid
        async function loadDayGrid(courseId, courseSlug, totalDays) {
            const gridContainer = document.getElementById('day-grid');
            
            try {
                const response = await API.progress.course(courseSlug);
                const lessons = response.data.lessons;
                
                const days = [];
                for (let i = 1; i <= totalDays; i++) {
                    const lesson = lessons.find(l => l.day_number === i) || {};
                    days.push({
                        day: i,
                        completed: lesson.lesson_completed && lesson.quiz_passed,
                        locked: lesson.is_locked,
                        current: i === currentDay
                    });
                }
                
                gridContainer.innerHTML = days.map(d => {
                    let className = 'day-item ';
                    if (d.current) {
                        className += 'current';
                    } else if (d.completed) {
                        className += 'completed';
                    } else if (d.locked) {
                        className += 'locked';
                    } else {
                        className += 'unlocked';
                    }
                    
                    const onclick = d.locked ? '' : `onclick="location.href='/lesson.html?slug=${courseSlug}&day=${d.day}'"`;
                    
                    return `
                        <div class="${className}" ${onclick} title="${d.locked ? 'Locked' : 'Day ' + d.day}">
                            ${d.locked ? '🔒' : d.day}
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Failed to load day grid:', error);
            }
        }
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
