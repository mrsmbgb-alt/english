<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - English Learning Platform</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/auth.js" defer></script>
    <script src="/assets/js/app.js" defer></script>
</head>
<body class="bg-gradient-to-br from-purple-600 to-blue-500 min-h-screen flex items-center justify-center px-4">
    
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
        
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="/" class="text-3xl font-bold text-purple-600">EnglishBD</a>
            <p class="text-gray-600 mt-2">Welcome back! Please login to continue.</p>
        </div>
        
        <!-- Login Form -->
        <form id="login-form" class="space-y-6">
            
            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    placeholder="your@email.com"
                >
                <div id="email-error" class="text-red-500 text-sm mt-1 hidden"></div>
            </div>
            
            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    placeholder="Enter your password"
                >
                <div id="password-error" class="text-red-500 text-sm mt-1 hidden"></div>
            </div>
            
            <!-- Remember Me -->
            <div class="flex items-center justify-between">
                <label class="flex items-center">
                    <input type="checkbox" id="remember-me" class="w-4 h-4 text-purple-600 rounded focus:ring-purple-500">
                    <span class="ml-2 text-sm text-gray-600">Remember me</span>
                </label>
                <a href="/forgot-password.html" class="text-sm text-purple-600 hover:underline">Forgot password?</a>
            </div>
            
            <!-- Submit Button -->
            <button 
                type="submit" 
                id="submit-btn"
                class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
            >
                Login
            </button>
            
        </form>
        
        <!-- Divider -->
        <div class="mt-6 text-center text-gray-600">
            Don't have an account? 
            <a href="/register.html" class="text-purple-600 font-semibold hover:underline">Sign up</a>
        </div>
        
    </div>
    
    <script>
        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear previous errors
            document.getElementById('email-error').classList.add('hidden');
            document.getElementById('password-error').classList.add('hidden');
            
            // Get form data
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';
            
            try {
                const response = await Auth.login(email, password, rememberMe);
                
                App.showToast(response.message || 'Login successful!', 'success');
                
                // Redirect
                const returnUrl = new URLSearchParams(window.location.search).get('return');
                setTimeout(() => {
                    window.location.href = returnUrl ? decodeURIComponent(returnUrl) : '/dashboard.html';
                }, 1000);
                
            } catch (error) {
                App.showToast(error.message || 'Login failed', 'error');
                
                // Show field-specific errors if available
                if (error.message.includes('email')) {
                    const emailError = document.getElementById('email-error');
                    emailError.textContent = error.message;
                    emailError.classList.remove('hidden');
                } else if (error.message.includes('password')) {
                    const passwordError = document.getElementById('password-error');
                    passwordError.textContent = error.message;
                    passwordError.classList.remove('hidden');
                }
                
                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
