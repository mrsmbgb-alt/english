<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Courses - English Learning Platform</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/ad-manager.js" defer></script>
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/auth.js" defer></script>
    <script src="/assets/js/app.js" defer></script>
</head>
<body class="bg-gray-50">
    
    <!-- Header Ad -->
    <div data-ad-slot="header"></div>
    
    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-purple-600">EnglishBD</a>
            
            <div class="hidden md:flex space-x-6">
                <a href="/index.html" class="text-gray-700 hover:text-purple-600">Home</a>
                <a href="/courses.html" class="text-purple-600 font-semibold">Courses</a>
                <a href="/dashboard.html" class="text-gray-700 hover:text-purple-600">Dashboard</a>
            </div>
            
            <div id="nav-auth"></div>
        </div>
    </nav>
    
    <!-- Hero Section -->
    <section class="bg-gradient-to-r from-purple-600 to-blue-500 text-white py-16">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-4xl font-bold mb-4">All Courses</h1>
            <p class="text-xl opacity-90">Choose your learning path</p>
        </div>
    </section>
    
    <!-- Filters -->
    <section class="bg-white shadow-sm py-4">
        <div class="container mx-auto px-4 flex flex-wrap gap-4">
            <select id="filter-category" class="px-4 py-2 border rounded-lg">
                <option value="">All Categories</option>
                <option value="Spoken English">Spoken English</option>
                <option value="Grammar">Grammar</option>
                <option value="Vocabulary">Vocabulary</option>
                <option value="IELTS">IELTS</option>
            </select>
            
            <select id="filter-level" class="px-4 py-2 border rounded-lg">
                <option value="">All Levels</option>
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>
            
            <input 
                type="text" 
                id="search-input" 
                placeholder="Search courses..."
                class="flex-1 px-4 py-2 border rounded-lg min-w-[200px]"
            >
        </div>
    </section>
    
    <!-- In-Content Ad -->
    <div data-ad-slot="in_content" class="container mx-auto px-4 my-8"></div>
    
    <!-- Courses Grid -->
    <section class="container mx-auto px-4 py-12">
        <div id="courses-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Loading -->
            <div class="col-span-full flex justify-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
            </div>
        </div>
    </section>
    
    <!-- Sidebar Ads (Desktop) -->
    <aside class="hidden lg:block fixed right-4 top-24 w-72">
        <div data-ad-slot="sidebar_top" class="mb-4"></div>
        <div data-ad-slot="sidebar_bottom"></div>
    </aside>
    
    <!-- Footer Ad -->
    <div data-ad-slot="footer" class="bg-gray-100 py-4"></div>
    
    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 EnglishBD. All rights reserved.</p>
        </div>
    </footer>
    
    <!-- Sticky Bottom Ad (Mobile) -->
    <div data-ad-slot="sticky_bottom" class="lg:hidden"></div>
    
    <script>
        let allCourses = [];
        
        async function init() {
            const user = await Auth.getUser();
            initNav(user);
            await loadCourses();
            initFilters();
        }
        
        function initNav(user) {
            const navAuth = document.getElementById('nav-auth');
            
            if (user) {
                navAuth.innerHTML = `
                    <span class="text-gray-700 hidden md:inline">Hi, ${App.escapeHtml(user.name)}</span>
                    <button onclick="Auth.logout()" class="text-gray-700 hover:text-purple-600">Logout</button>
                `;
            } else {
                navAuth.innerHTML = `
                    <a href="/login.html" class="text-gray-700 hover:text-purple-600">Login</a>
                    <a href="/register.html" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">Sign Up</a>
                `;
            }
        }
        
        async function loadCourses() {
            const grid = document.getElementById('courses-grid');
            
            try {
                const response = await API.courses.list({ limit: 50 });
                allCourses = response.data.courses;
                renderCourses(allCourses);
            } catch (error) {
                grid.innerHTML = '<p class="col-span-full text-center text-red-500">Failed to load courses</p>';
            }
        }
        
        function renderCourses(courses) {
            const grid = document.getElementById('courses-grid');
            
            if (courses.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500">No courses found</p>';
                return;
            }
            
            grid.innerHTML = courses.map(course => `
                <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition">
                    <img src="${course.thumbnail || '/assets/img/course-default.jpg'}" alt="${App.escapeHtml(course.title)}" class="w-full h-48 object-cover">
                    <div class="p-6">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-xs font-semibold text-purple-600 uppercase">${App.escapeHtml(course.category)}</span>
                            <span class="text-xs bg-gray-100 px-2 py-1 rounded">${App.escapeHtml(course.level)}</span>
                        </div>
                        <h3 class="text-xl font-bold mb-3">${App.escapeHtml(course.title)}</h3>
                        <p class="text-gray-600 mb-4 line-clamp-2">${App.escapeHtml(course.short_description)}</p>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-500">${course.total_days} Days</span>
                            <a href="/course-detail.html?slug=${course.slug}" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 transition">
                                View Details
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function initFilters() {
            const categoryFilter = document.getElementById('filter-category');
            const levelFilter = document.getElementById('filter-level');
            const searchInput = document.getElementById('search-input');
            
            const applyFilters = () => {
                let filtered = allCourses;
                
                const category = categoryFilter.value;
                const level = levelFilter.value;
                const search = searchInput.value.toLowerCase();
                
                if (category) {
                    filtered = filtered.filter(c => c.category === category);
                }
                
                if (level) {
                    filtered = filtered.filter(c => c.level === level);
                }
                
                if (search) {
                    filtered = filtered.filter(c => 
                        c.title.toLowerCase().includes(search) ||
                        c.short_description.toLowerCase().includes(search)
                    );
                }
                
                renderCourses(filtered);
            };
            
            categoryFilter.addEventListener('change', applyFilters);
            levelFilter.addEventListener('change', applyFilters);
            searchInput.addEventListener('input', applyFilters);
        }
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
