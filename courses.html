<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Courses — English Platform</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />

  <script src="/assets/js/ad-manager.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="container-page px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-bold text-lg">English Platform</a>
      <nav class="flex items-center gap-3 text-sm">
        <a href="/courses.html" class="hover:underline font-semibold">Courses</a>
        <a href="/dashboard.html" class="hover:underline auth-only hidden">Dashboard</a>
        <a href="/login.html" class="hover:underline guest-only">Login</a>
        <a href="/register.html" class="hover:underline guest-only">Register</a>
        <button class="auth-only hidden px-3 py-1 rounded bg-slate-900 text-white" id="logoutBtn">Logout</button>
      </nav>
    </div>
    <div class="container-page px-4 pb-3">
      <div class="ad-slot" data-ad-slot="header"></div>
    </div>
  </header>

  <main class="container-page px-4 py-4">
    <div class="layout-grid">
      <aside class="sidebar-left">
        <div class="p-3 rounded bg-white border border-slate-200">
          <h3 class="font-semibold mb-2">Filters</h3>

          <form id="filterForm" class="space-y-2 text-sm">
            <div>
              <label class="text-xs text-slate-600">Search</label>
              <input name="q" class="w-full px-3 py-2 rounded bg-slate-50 border border-slate-200" placeholder="IELTS / Grammar / Spoken" />
            </div>

            <div>
              <label class="text-xs text-slate-600">Category</label>
              <input name="category" class="w-full px-3 py-2 rounded bg-slate-50 border border-slate-200" placeholder="Spoken / Grammar" />
            </div>

            <div>
              <label class="text-xs text-slate-600">Level</label>
              <select name="level" class="w-full px-3 py-2 rounded bg-slate-50 border border-slate-200">
                <option value="">All</option>
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
              </select>
            </div>

            <button class="w-full px-3 py-2 rounded bg-blue-600 text-white">Apply</button>
          </form>

          <p class="mt-3 text-xs text-slate-600">Bangla: Filter ব্যবহার করে নিজের level অনুযায়ী course বাছাই করুন।</p>
        </div>
      </aside>

      <section class="content">
        <article class="p-4 rounded bg-white border border-slate-200">
          <h1 class="text-xl font-bold">All Courses</h1>
          <p class="text-sm text-slate-600 mt-1">Browse and enroll. Enroll করলে Day 1 unlock হবে।</p>

          <div class="mt-4 ad-slot" data-ad-slot="in_content" data-ad-index="0"></div>

          <div id="alert" class="hidden mt-4 p-3 rounded text-sm"></div>

          <div id="list" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3"></div>

          <div class="mt-4 ad-slot" data-ad-slot="in_content" data-ad-index="1"></div>
        </article>

        <div class="mt-4 ad-slot" data-ad-slot="footer"></div>
      </section>

      <aside class="sidebar-right">
        <div class="ad-slot" data-ad-slot="sidebar_top"></div>
        <div class="mt-4 p-3 rounded bg-white border border-slate-200">
          <h3 class="font-semibold">Unlock rule</h3>
          <p class="text-sm text-slate-700 mt-2">
            Day N+1 unlock হবে যখন Day N lesson complete + quiz passed (≥60%).
          </p>
        </div>
        <div class="mt-4 ad-slot" data-ad-slot="sidebar_bottom"></div>
      </aside>
    </div>
  </main>

  <div class="sticky-bottom-wrap">
    <div class="ad-slot sticky-bottom-ad" data-ad-slot="sticky_bottom"></div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      window.AdManager?.init?.();

      const alertBox = document.getElementById('alert');
      const show = (ok, msg) => {
        alertBox.className = 'mt-4 p-3 rounded text-sm ' + (ok ? 'bg-green-100 text-green-900' : 'bg-red-100 text-red-900');
        alertBox.textContent = msg;
        alertBox.classList.remove('hidden');
      };

      const listEl = document.getElementById('list');
      const form = document.getElementById('filterForm');

      const render = (courses) => {
        if (!courses?.length) {
          listEl.innerHTML = `<div class="text-sm text-slate-600">No courses found.</div>`;
          return;
        }
        listEl.innerHTML = courses.map(c => {
          const enrolled = Number(c.is_enrolled || 0) === 1;
          return `
            <div class="p-3 rounded border border-slate-200 bg-white">
              <div class="font-semibold">${window.App.escapeHtml(c.title)}</div>
              <div class="text-xs text-slate-600 mt-1">${window.App.escapeHtml(c.short_description || '')}</div>
              <div class="text-xs text-slate-500 mt-2">
                Days: ${c.total_days} · Level: ${window.App.escapeHtml(c.level)} · Category: ${window.App.escapeHtml(c.category || '')}
              </div>
              <div class="mt-3 flex flex-wrap gap-2">
                <a class="px-3 py-2 rounded bg-slate-900 text-white text-sm"
                   href="/course-detail.html?course=${encodeURIComponent(c.slug)}">View</a>
                ${
                  enrolled
                    ? `<a class="px-3 py-2 rounded bg-blue-600 text-white text-sm"
                          href="/lesson.html?course=${encodeURIComponent(c.slug)}&day=1">Continue</a>`
                    : `<button data-enroll="${window.App.escapeHtml(c.slug)}"
                          class="px-3 py-2 rounded bg-green-600 text-white text-sm">Enroll</button>`
                }
              </div>
            </div>
          `;
        }).join('');
      };

      const loadCourses = async (params = {}) => {
        const qs = new URLSearchParams(params).toString();
        const res = await window.API.get('/api/courses/list.php' + (qs ? `?${qs}` : ''));
        render(res?.data || []);
      };

      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        alertBox.classList.add('hidden');
        const fd = new FormData(form);
        const params = {
          q: String(fd.get('q') || '').trim(),
          category: String(fd.get('category') || '').trim(),
          level: String(fd.get('level') || '').trim()
        };
        await loadCourses(params);
      });

      listEl.addEventListener('click', async (ev) => {
        const btn = ev.target.closest('button[data-enroll]');
        if (!btn) return;

        const slug = btn.getAttribute('data-enroll');
        if (!window.Auth.isLoggedIn()) {
          show(false, 'Please login to enroll');
          setTimeout(() => location.href = '/login.html', 700);
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Enrolling...';

        try {
          const res = await window.API.post('/api/courses/enroll.php', { course: slug });
          if (!res?.success) {
            btn.disabled = false;
            btn.textContent = 'Enroll';
            return show(false, res?.message || 'Enroll failed');
          }
          show(true, 'Enrolled! Redirecting to Day 1...');
          setTimeout(() => location.href = `/lesson.html?course=${encodeURIComponent(slug)}&day=1`, 700);
        } catch (e) {
          btn.disabled = false;
          btn.textContent = 'Enroll';
          show(false, 'Network error');
        }
      });

      await loadCourses();
    });
  </script>
</body>
</html>
